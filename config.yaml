name: EatMe
slug: eatme
version: "0.8.5"
description: Self-hosted household food inventory with freshness guidance
url: https://github.com/lewisf94/EatMe
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
# Optional LAN port — used by the e-ink display (P6) and for local access.
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: EatMe web/API (LAN + e-ink display)
webui: "http://[HOST]:[PORT:8099]"
watchdog: "http://[HOST]:[PORT:8099]/api/health"
# /data is persisted and included in Home Assistant backups.
map:
  - type: data
    read_only: false
options:
  auth_token: ""
  display_token: ""
  magtag_token: ""
  tailscale_authkey: ""
  tailscale_hostname: eatme
  # The separate EatMe OCR app performs real, private receipt recognition.
  # "stub" is retained only for development and returns fixed demonstration data.
  receipt_provider: local
  ocr_url: ""
schema:
  auth_token: password?
  display_token: password?
  magtag_token: password?
  tailscale_authkey: password?
  tailscale_hostname: str?
  receipt_provider: list(stub|local)?
  ocr_url: str?
