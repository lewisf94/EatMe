name: CI

on:
  push:
    branches: [main, ha-canary]
  pull_request:

jobs:
  check:
    name: check + unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24] # 22 = sandbox floor (node:sqlite experimental), 24 = target (stable)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check # tsc across packages + prettier
      - run: pnpm test # vitest (shared status/OFF logic)

  e2e:
    name: browser e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Install the browser matching this @playwright/test version (+ system libs).
      - run: pnpm --filter @eatme/e2e exec playwright install --with-deps chromium
      # The e2e script builds the web PWA, then Playwright boots the server
      # (with and without the auth token) and drives the real app.
      - run: pnpm --filter @eatme/e2e run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  docker:
    name: add-on image (${{ matrix.ha_arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            ha_arch: amd64
          - platform: linux/arm64
            ha_arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build the exact Home Assistant architecture images
        run: |
          version="$(awk -F'"' '/^version:/ { print $2 }' config.yaml)"
          ocr_version="$(awk -F'"' '/^version:/ { print $2 }' addon/ocr/config.yaml)"
          test -n "${version}" && test -n "${ocr_version}"
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --build-arg "BUILD_ARCH=${{ matrix.ha_arch }}" \
            --build-arg "BUILD_VERSION=${version}" \
            --load \
            --tag "eatme-addon:ci-${{ matrix.ha_arch }}" \
            .
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --build-arg "BUILD_ARCH=${{ matrix.ha_arch }}" \
            --build-arg "BUILD_VERSION=${ocr_version}" \
            --load \
            --tag "eatme-ocr:ci-${{ matrix.ha_arch }}" \
            addon/ocr
      - name: Load the enforced Home Assistant AppArmor profile
        run: |
          command -v apparmor_parser >/dev/null || {
            sudo apt-get update
            sudo apt-get install --yes apparmor-utils
          }
          sudo apparmor_parser -r -W apparmor.txt
          sudo aa-status | grep -F "eatme"
      - name: Start the image and exercise startup-only dependencies
        env:
          IMAGE: eatme-addon:ci-${{ matrix.ha_arch }}
          OCR_IMAGE: eatme-ocr:ci-${{ matrix.ha_arch }}
        run: |
          set -Eeuo pipefail
          container="eatme-ci-${{ matrix.ha_arch }}"
          ocr_container="eatme-ocr-ci-${{ matrix.ha_arch }}"
          data_dir="$(mktemp -d)"
          printf '{}\n' > "${data_dir}/options.json"

          cleanup() {
            docker logs "${container}" || true
            docker logs "${ocr_container}" || true
            docker rm --force "${container}" >/dev/null 2>&1 || true
            docker rm --force "${ocr_container}" >/dev/null 2>&1 || true
            sudo apparmor_parser -R apparmor.txt >/dev/null 2>&1 || true
            rm -rf "${data_dir}"
          }
          trap cleanup EXIT

          docker run --detach \
            --name "${ocr_container}" \
            --platform "${{ matrix.platform }}" \
            --publish 127.0.0.1:18765:8765 \
            "${OCR_IMAGE}"

          ocr_ready=false
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18765/health | grep -F '"engine":"tesseract"' >/dev/null; then
              ocr_ready=true
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' "${ocr_container}" | grep -qx true; then
              echo "EatMe OCR exited before becoming healthy"
              docker inspect --format '{{json .State}}' "${ocr_container}"
              docker logs "${ocr_container}" || true
              exit 1
            fi
            sleep 1
          done
          test "${ocr_ready}" = true
          docker exec "${ocr_container}" python -m unittest -q test_server.py

          # Generate a readable receipt without adding a binary test fixture,
          # then prove the actual OCR endpoint recognises its product line.
          docker exec "${ocr_container}" python -c \
            "from PIL import Image,ImageDraw,ImageFont; im=Image.new('RGB',(1100,700),(100,55,25)); receipt=Image.new('RGB',(900,600),'white'); d=ImageDraw.Draw(receipt); f=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',42); d.text((50,35),'TESCO',font=f,fill='black'); rows=[('MILK','1.50'),('BREAD','1.20'),('TOTAL','2.70')]; [(d.text((50,120+i*90),name,font=f,fill='black'),d.text((700,120+i*90),price,font=f,fill='black')) for i,(name,price) in enumerate(rows)]; im.paste(receipt,(100,50)); im.save('/tmp/receipt.png')"
          docker cp "${ocr_container}:/tmp/receipt.png" /tmp/eatme-ocr-receipt.png
          curl --fail --silent \
            --data-binary @/tmp/eatme-ocr-receipt.png \
            http://127.0.0.1:18765/ocr \
            | grep -E 'MILK[^"}]*1[.]50'

          docker run --detach \
            --name "${container}" \
            --platform "${{ matrix.platform }}" \
            --publish 127.0.0.1:18099:8099 \
            --volume "${data_dir}:/data" \
            "${IMAGE}"

          ready=false
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18099/api/health >/dev/null; then
              ready=true
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' "${container}" | grep -qx true; then
              echo "EatMe exited before becoming healthy"
              docker inspect --format '{{json .State}}' "${container}"
              docker logs "${container}" || true
              exit 1
            fi
            sleep 1
          done
          test "${ready}" = true

          # Force-load the bundled food data and native resvg renderer.
          curl --fail --silent \
            "http://127.0.0.1:18099/api/guidance?name=milk" \
            | grep -F '"data"'
          curl --fail --silent \
            --output /tmp/eatme-display.png \
            "http://127.0.0.1:18099/api/display.png"
          file /tmp/eatme-display.png | grep -F "PNG image data"
          curl --fail --silent \
            --output /tmp/eatme-magtag.bmp \
            "http://127.0.0.1:18099/api/magtag/display.bmp?battery=77"
          python3 -c "import struct; p=open('/tmp/eatme-magtag.bmp','rb').read(); assert p[:2] == b'BM'; assert struct.unpack_from('<I',p,2)[0] == len(p); assert struct.unpack_from('<ii',p,18) == (296,128); assert struct.unpack_from('<H',p,28)[0] == 4"
          curl --fail --silent \
            --header "content-type: application/json" \
            --data '{"battery":77,"wakeReason":"ci","firmware":"ci","rssi":-50}' \
            http://127.0.0.1:18099/api/magtag/status \
            | grep -F '"ok":true'
          curl --fail --silent \
            --header "content-type: application/json" \
            --data '{"button":"refresh"}' \
            http://127.0.0.1:18099/api/magtag/button \
            | grep -F '"ok":true'
          curl --fail --silent http://127.0.0.1:18099/ | grep -F "<div id=\"root\">"
